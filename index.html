const onTouchEnd=(e,r,c)=>{const raw=e.currentTarget.dataset.touchStart;if(!raw)return;delete e.currentTarget.dataset.touchStart;const [x,y,sr,sc]=raw.split(',').map(Number),t=e.changedTouches?.[0];if(!t)return;const dx=t.clientX-x,dy=t.clientY-y;if(Math.max(Math.abs(dx),Math.abs(dy))<20)return;let rr=sr,cc=sc;if(Math.abs(dx)>Math.abs(dy))cc+=dx>0?1:-1;else rr+=dy>0?1:-1;if(rr>=0&&rr<cfg.size&&cc>=0&&cc<cfg.size){if(booster){act(sr,sc);return}if(Math.abs(rr-sr)+Math.abs(cc-sc)===1){Sel({r:sr,c:sc});setTimeout(()=>act(rr,cc),45)}}};
return <div className="app"><div className={'toast '+(toast?'show':'')}>{toast}</div><header className="top"><div className="brand" onClick={home}>PEBBLE POP<small>DELUXE • INFINITE ARCADE</small></div><div className="actions"><button className="icon" title="Voice" onClick={()=>{V(v=>!v);if(voice&&window.speechSynthesis)window.speechSynthesis.cancel();notify(voice?'Voice off':'Voice on')}}><i className={'fa-solid '+(voice?'fa-volume-high':'fa-volume-xmark')}></i></button><button className="icon" title="Sound effects" onClick={()=>{Sound(v=>!v);notify(sound?'Sound effects off':'Sound effects on')}}><i className={'fa-solid '+(sound?'fa-volume-high':'fa-volume-xmark')}></i></button><button className="icon" title="Background music" aria-label="Toggle background music" onClick={()=>{Music(v=>{const next=!v;if(next&&screen==='game'&&!modal)startMusic();else stopMusic();notify(next?'Background music on':'Background music off');return next})}}><i className={'fa-solid '+(music?'fa-headphones':'fa-ban')}></i></button><button className="icon" title="Home" onClick={home}><i className="fa-solid fa-house"></i></button></div></header>
{screen==='home'?<main className="home panel"><div className="eyebrow">THE MATCH-3 ARCADE NEVER ENDS</div><h1 className="hero">PEBBLE <em>POP!</em></h1><p className="desc">Swipe or tap to match 3 or more pebbles, trigger chain reactions, and uncover surprise boosters. Every level brings a new twist — from Level 1 to <b>1,000,000,000</b>.</p><div className="pebbles"><div className="orb c0"><i className="fa-solid fa-heart"></i></div><div className="orb c1"><i className="fa-solid fa-droplet"></i></div><div className="orb c2"><i className="fa-solid fa-star"></i></div><div className="orb c3"><i className="fa-solid fa-leaf"></i></div><div className="orb c4"><i className="fa-solid fa-gem"></i></div></div><div className="homebuttons"><button className="primary" onClick={()=>start(1)}><i className="fa-solid fa-play"></i> NEW GAME</button><button className="secondary" onClick={()=>start(bestLevel)}><i className="fa-solid fa-forward"></i> CONTINUE · LVL {bestLevel.toLocaleString()}</button><button className="secondary" onClick={()=>notify('High score: '+best.toLocaleString())}><i className="fa-solid fa-trophy"></i> HIGH SCORE</button></div><div className="stats"><div className="stat"><strong>{best.toLocaleString()}</strong><span>High score</span></div><div className="stat"><strong>{bestLevel.toLocaleString()}</strong><span>Best level</span></div><div className="stat"><strong>{wins.toLocaleString()}</strong><span>Levels won</span></div></div><p className="foot">Match 3 or more. Use Blast, Rainbow, and Undo strategically. Sound and voice controls are at the top.</p></main>:<div className="layout"><main className="main panel"><div className="gamehead"><div><div className="label">CURRENT CHALLENGE</div><div className="level">LEVEL {level.toLocaleString()}</div></div><div className="score">{score.toLocaleString()}<small>SCORE / {cfg.target.toLocaleString()}</small></div></div><section className="challenge"><div style={{display:'flex',justifyContent:'space-between',gap:8}}><b>{cfg.mode}</b><strong>{left} moves left</strong></div><div style={{marginTop:5}}>Target score: {cfg.target.toLocaleString()}{cfg.needsCombo?` • Combo chains: ${comboGoal}/${cfg.needsCombo}`:''}{cfg.needsFrozen?` • Frozen cracked: ${frozenGoal}/${cfg.needsFrozen}`:''}</div><div className="bar"><div style={{width:clamp(score/cfg.target*100,0,100)+'%'}}></div></div></section><div className="boardwrap"><div className="board" style={{gridTemplateColumns:`repeat(${cfg.size},minmax(0,1fr))`}}>{board.map((row,r)=>row.map((g,c)=><button key={g.id} aria-label={`pebble ${r+1} ${c+1}`} className={'tile '+(selected&&selected.r===r&&selected.c===c?'selected ':'')} onClick={()=>act(r,c)} onTouchStart={e=>onTouchStart(e,r,c)} onTouchEnd={e=>onTouchEnd(e,r,c)}><span className={'gem c'+g.type+(g.special?' special':'')+(g.frozen?' frozen ':'')+(g.gold?' golden':'')}>{g.special==='bomb'?<i className="fa-solid fa-bomb"></i>:g.special==='rainbow'?<i className="fa-solid fa-wand-magic-sparkles"></i>:<i className={'fa-solid '+icons[g.type]} />}{g.frozen&&<i className="fa-solid fa-snowflake" style={{position:'absolute',right:0,top:0,fontSize:10}}/>}{g.gold&&<i className="fa-solid fa-star" style={{position:'absolute',left:0,top:0,fontSize:9,color:'#fff2a0'}}/>}</span></button>))}</div></div><div className="tools"><button className="tool" onClick={()=>{Boost(v=>v==='bomb'?'':'bomb');notify('Tap a pebble to blast a 3×3 area')}}><i className="fa-solid fa-bomb"></i> Blast <b>{boosterCharges.bomb}</b></button><button className="tool" onClick={()=>{Boost(v=>v==='rainbow'?'':'rainbow');notify('Tap a pebble to clear its colour')}}><i className="fa-solid fa-wand-magic-sparkles"></i> Rainbow <b>{boosterCharges.rainbow}</b></button><button className="tool" onClick={()=>{Boost('undo');notify('Tap a pebble to undo the last move')}}><i className="fa-solid fa-rotate-left"></i> Undo</button></div><p className="foot">{booster?`BOOSTER SELECTED: ${booster.toUpperCase()} — tap a pebble to use it.`:'Tap two adjacent pebbles to swap, or swipe a pebble in any direction.'}</p></main><aside className="side panel"><section className="card"><h3><i className="fa-solid fa-bullseye" style={{color:'var(--pink)'}}></i> Level mission</h3><div className="mission">◉ Reach the score target</div><div className="mission">◉ Build combo chains {cfg.needsCombo?`(${comboGoal}/${cfg.needsCombo})`:''}</div><div className="mission">◉ Crack frozen pebbles {cfg.needsFrozen?`(${frozenGoal}/${cfg.needsFrozen})`:'(bonus)'}</div></section><section className="card"><h3><i className="fa-solid fa-wand-magic-sparkles" style={{color:'var(--gold)'}}></i> Level twist</h3><p><b style={{color:'var(--cyan)'}}>{cfg.mode}</b><br/>{cfg.twists.join(' • ')||'Learn the board, build combos, find your rhythm.'}<br/><br/>Procedural challenges scale across one billion levels.</p></section><section className="card"><h3><i className="fa-solid fa-trophy" style={{color:'var(--gold)'}}></i> Arcade stats</h3><p>High score: <b>{best.toLocaleString()}</b><br/>Best level: <b>{bestLevel.toLocaleString()}</b><br/>Combo chain: <b>{combo}</b></p></section><section className="card"><h3><i className="fa-solid fa-microphone-lines" style={{color:'var(--green)'}}></i> Cheerleader voice</h3><p>{voice?'ON — hear “Pebblelicious!”, “Cool!”, and “Fantastic!” after moves.':'OFF — tap the speaker button to enable praise.'} Voice begins after your first interaction.</p></section><button className="secondary" onClick={home}><i className="fa-solid fa-house"></i> HOME / NEW GAME</button></aside></div>}
