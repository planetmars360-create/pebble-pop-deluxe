filter:brightness(1.3)}.gem{width:79%;height:79%;font-size:clamp(12px,3vw,27px);position:relative}.gem:after{content:"";position:absolute;width:25%;height:10%;top:13%;left:18%;border-radius:50%;background:#ffffff80;transform:rotate(-30deg)}.special{box-shadow:0 0 13px #fff9,inset -5px -6px #0002,inset 4px 4px #ffffff60;animation:pulse .8s infinite alternate}.frozen{filter:grayscale(.55)}.frozen:after{content:"❄";position:absolute;right:1px;top:0;font-size:10px}.golden:after{content:"✦";position:absolute;left:1px;top:0;color:#fff2a0;font-size:10px}@keyframes pulse{to{filter:brightness(1.35)}}.tools{display:flex;gap:7px;margin-top:12px}.tool{flex:1;padding:10px 4px;border-radius:13px;background:#ffffff12;border:1px solid #ffffff20;font-size:12px;font-weight:900}.tool b{color:var(--gold)}.side{display:grid;align-content:start;gap:11px}.card{padding:13px;border-radius:15px;background:#ffffff0b;border:1px solid #ffffff18}.card h3{font:700 19px Fredoka;margin:0 0 9px}.card p,.mission{font-size:12px;color:#c6c9e9;line-height:1.55;margin:0}.mission{margin:7px 0}.toast{position:fixed;z-index:9;left:50%;top:15px;transform:translate(-50%,-20px);opacity:0;pointer-events:none;background:#fff;color:#24213e;font:700 22px Fredoka;padding:12px 20px;border-radius:17px;box-shadow:0 10px 35px #0005;white-space:nowrap;transition:.2s;max-width:94vw}.toast.show{opacity:1;transform:translate(-50%,0)}.overlay{position:fixed;inset:0;z-index:10;background:#090a1acc;backdrop-filter:blur(8px);display:grid;place-items:center;padding:18px}.modal{max-width:430px;width:100%;padding:25px;text-align:center}.modal h2{font:700 38px Fredoka;margin:8px}.modal p{color:#c6c9e9;line-height:1.5}.modal button{width:100%;margin-top:10px}.hidden{display:none!important}.foot{text-align:center;color:#8f94bd;font-size:10px;margin:16px 0}@media(max-width:780px){.layout{grid-template-columns:1fr}.side{grid-template-columns:repeat(2,minmax(0,1fr))}.side .card:last-child{grid-column:1/-1}}@media(max-width:440px){.side{grid-template-columns:1fr}.side .card:last-child{grid-column:auto}.board{gap:3px}.main{padding:10px}.home{margin-top:2vh}.pebbles{height:120px}.tool{font-size:10px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script><script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script><script src="https://unpkg.com/@babel/standalone/babel.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script><script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<script type="text/babel">
const{useState,useEffect,useRef}=React,icons=['fa-heart','fa-droplet','fa-star','fa-leaf','fa-gem','fa-fire'],praise=['Pebblelicious!','Cool move!','Fantastic!','You rock!','Mega match!','Pebble power!','Brilliant swipe!','Pop-tastic!','Legendary!','Smooth moves!','Dazzling!','Combo-tastic!'],modes=['Classic Pop','Gem Hunt','Combo Rush','Golden Pebbles','Frozen Trouble','Bomb Voyage','Rainbow Rally','Treasure Trail','Speed Spark','Mystery Mix'];
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
function config(l){let band=Math.floor(Math.log2(l));return{size:l<100?8:l<100000?9:10,types:clamp(4+Math.floor(band/3),4,6),moves:clamp(24-Math.floor(band/2),12,24),target:clamp(500+l*95+band*100,500,999999999),mode:modes[(l-1)%modes.length],goal:l%10===0?'Score target + make 3 combos':l%5===0?'Score target + crack frozen pebbles':'Reach the score target before moves run out',twists:[l%3===0?'More special pebbles':'',l%4===0?'Higher score target':'',l%5===0?'Frozen tiles':'',l%7===0?'Golden bonus tiles':'',l%11===0?'Limited booster charges':''].filter(Boolean)}}
function makeBoard(cfg,l){let b=Array.from({length:cfg.size},()=>Array.from({length:cfg.size},()=>({type:Math.floor(Math.random()*cfg.types),special:'',frozen:l%5===0&&Math.random()<.035,gold:l%7===0&&Math.random()<.05,id:Math.random()})));for(let pass=0;pass<4;pass++)for(let r=0;r<b.length;r++)for(let c=0;c<b.length;c++)if((c>1&&b[r][c].type===b[r][c-1].type&&b[r][c].type===b[r][c-2].type)||(r>1&&b[r][c].type===b[r-1][c].type&&b[r][c].type===b[r-2][c].type))b[r][c].type=(b[r][c].type+1+Math.floor(Math.random()*(cfg.types-1)))%cfg.types;for(let i=0;i<Math.min(4,Math.floor(l/3));i++){let r=Math.random()*b.length|0,c=Math.random()*b.length|0;if(l%7===0)b[r][c].special='rainbow';else if(l%3===0)b[r][c].special='bomb'}return b}
function matches(b){let map=new Map(),n=b.length;for(let r=0;r<n;r++)for(let c=0;c<n;){let e=c+1;while(e<n&&b[r][e]&&b[r][c]&&b[r][e].type===b[r][c].type)e++;if(b[r][c]&&e-c>=3)for(let k=c;k<e;k++)map.set(r+','+k,{r,c:k});c=e}for(let c=0;c<n;c++)for(let r=0;r<n;){let e=r+1;while(e<n&&b[e][c]&&b[r][c]&&b[e][c].type===b[r][c].type)e++;if(b[r][c]&&e-r>=3)for(let k=r;k<e;k++)map.set(k+','+c,{r:k,c});r=e}return[...map.values()]}
function settle(board,cfg){let b=board.map(row=>row.map(x=>x&&({...x}))),chain=0,points=0,found=matches(b);while(found.length&&chain<8){chain++;let clear=new Set(found.map(p=>p.r+','+p.c));for(const p of found){let g=b[p.r][p.c];if(g?.special==='bomb')for(let r=Math.max(0,p.r-1);r<=Math.min(b.length-1,p.r+1);r++)for(let c=Math.max(0,p.c-1);c<=Math.min(b.length-1,p.c+1);c++)clear.add(r+','+c);if(g?.special==='rainbow')for(let r=0;r<b.length;r++)for(let c=0;c<b.length;c++)if(b[r][c]?.type===g.type)clear.add(r+','+c)}clear.forEach(k=>{let[r,c]=k.split(',').map(Number),g=b[r][c];if(g){points+=10+(g.gold?20:0)+(g.special?50:0)+(g.frozen?25:0);b[r][c]=null}});for(let c=0;c<b.length;c++){let keep=[];for(let r=b.length-1;r>=0;r--)if(b[r][c])keep.push(b[r][c]);while(keep.length<b.length)keep.push({type:Math.random()*cfg.types|0,special:'',frozen:false,gold:false,id:Math.random()});for(let r=b.length-1,i=0;r>=0;r--,i++)b[r][c]=keep[i]}found=matches(b)}return{board:b,points,chain}}
function App(){const[screen,S]=useState('home'),[level,L]=useState(1),[board,B]=useState([]),[selected,Sel]=useState(null),[score,Sc]=useState(0),[moves,M]=useState(0),[left,Left]=useState(24),[combo,C]=useState(0),[best,Best]=useState(+(localStorage.ppdBest||0)),[bestLevel,BL]=useState(+(localStorage.ppdLevel||1)),[wins,W]=useState(+(localStorage.ppdWins||0)),[voice,V]=useState(true),[sound,Sound]=useState(true),[toast,T]=useState(''),[modal,Modal]=useState(''),[booster,Boost]=useState(''),[undo,U]=useState(null);const cfg=config(level),boardRef=useRef(board),busy=useRef(false),timer=useRef(),synth=useRef();useEffect(()=>{boardRef.current=board},[board]);const say=(text)=>{if(!voice||!window.speechSynthesis)return;window.speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.rate=1.08;u.pitch=1.18;window.speechSynthesis.speak(u)};const ping=async(win=false)=>{if(!sound||!window.Tone)return;try{await Tone.start();if(!synth.current)synth.current=new Tone.PolySynth(Tone.Synth,{volume:-12,oscillator:{type:'triangle'}}).toDestination();(win?['C5','E5','G5','C6']:['C5','E5','G5']).forEach((n,i)=>synth.current.triggerAttackRelease(n,'8n',Tone.now()+i*.07))}catch(e){}};const notify=(x)=>{T(x);clearTimeout(timer.current);timer.current=setTimeout(()=>T(''),1450)};const bestUpdate=(s,l)=>{if(s>+(localStorage.ppdBest||0)){localStorage.ppdBest=s;Best(s)}if(l>+(localStorage.ppdLevel||1)){localStorage.ppdLevel=l;BL(l)}};const start=(l=1)=>{l=clamp(Math.floor(l),1,1000000000);let c=config(l);L(l);Sc(0);M(0);C(0);Left(c.moves);B(makeBoard(c,l));Sel(null);Boost('');U(null);Modal('');S('game');busy.current=false};const home=()=>{S('home');Modal('');Boost('');Sel(null);if(window.speechSynthesis)window.speechSynthesis.cancel()};const finish=(win)=>{bestUpdate(score,level);Modal(win?'win':'lose');if(win){say('Pebblelicious! Level complete! Fantastic!');ping(true);if(window.confetti)confetti({particleCount:120,spread:75,origin:{y:.65}})}else say('Good try! One more round!')};
useEffect(()=>{if(screen==='game'&&!modal&&score>=cfg.target)finish(true)},[score]);useEffect(()=>{if(screen==='game'&&!modal&&left<=0)finish(false)},[left]);
const act=(r,c)=>{if(screen!=='game'||modal||busy.current)return;let current=boardRef.current;if(booster){if(booster==='undo'){if(undo){B(undo.board);Sc(undo.score);Left(undo.left);M(undo.moves);C(undo.combo);U(null);notify('Move rewound!');say('Clever rewind!')}else notify('Make a move first');Boost('');return}let b=current.map(row=>row.map(x=>({...x})));if(booster==='bomb'){for(let rr=Math.max(0,r-1);rr<=Math.min(b.length-1,r+1);rr++)for(let cc=Math.max(0,c-1);cc<=Math.min(b.length-1,c+1);cc++)b[rr][cc]=null}else{let typ=b[r][c].type;for(let rr=0;rr<b.length;rr++)for(let cc=0;cc<b.length;cc++)if(b[rr][cc].type===typ)b[rr][cc]=null}for(let cc=0;cc<b.length;cc++){let keep=[];for(let rr=b.length-1;rr>=0;rr--)if(b[rr][cc])keep.push(b[rr][cc]);while(keep.length<b.length)keep.push({type:Math.random()*cfg.types|0,special:'',frozen:false,gold:false,id:Math.random()});for(let rr=b.length-1,i=0;rr>=0;rr--,i++)b[rr][cc]=keep[i]}U({board:current,score,left,moves,combo});B(b);Sc(v=>v+(booster==='bomb'?180:220));Left(v=>v-1);M(v=>v+1);Boost('');let p=booster==='bomb'?'Boomtastic!':'Rainbow-riffic!';notify(p);say(p);ping();return}
if(!selected){Sel({r,c});return}if(selected.r===r&&selected.c===c){Sel(null);return}if(Math.abs(selected.r-r)+Math.abs(selected.c-c)!==1){Sel({r,c});return}let b=current.map(row=>row.map(x=>({...x}))),a=b[selected.r][selected.c];b[selected.r][selected.c]=b[r][c];b[r][c]=a;let found=matches(b);if(!found.length&&!a.special&&!b[r][c].special){Sel(null);notify('Match 3 or more pebbles!');return}busy.current=true;U({board:current,score,left,moves,combo});Sel(null);let result=settle(b,cfg),pts=Math.max(60,result.points)*(Math.max(1,result.chain));B(result.board);Sc(v=>{let n=v+pts;bestUpdate(n,level);return n});Left(v=>v-1);M(v=>v+1);C(v=>v+Math.max(1,result.chain));let p=result.chain>2?'Unbelievable combo!':result.chain===2?'Combo-tastic!':praise[Math.random()*praise.length|0];notify(p+' +'+pts);say(p);ping();if(result.chain>1&&window.confetti)confetti({particleCount:35,spread:45,origin:{y:.7}});setTimeout(()=>busy.current=false,180)};
return <div className="app"><div className={'toast '+(toast?'show':'')}>{toast}</div><header className="top"><div className="brand" onClick={home}>PEBBLE POP<small>DELUXE • INFINITE ARCADE</small></div><div className="actions"><button className="icon" title="Voice" onClick={()=>{V(v=>!v);if(voice&&window.speechSynthesis)window.speechSynthesis.cancel();notify(voice?'Voice off':'Voice on')}><i className={'fa-solid '+(voice?'fa-volume-high':'fa-volume-xmark')}></i></button><button className="icon" title="Music sounds" onClick={()=>Sound(v=>!v)}><i className={'fa-solid '+(sound?'fa-music':'fa-volume-off')}></i></button><button className="icon" title="Home" onClick={home}><i className="fa-solid fa-house"></i></button></div></header>
{screen==='home'?<main className="home panel"><div className="eyebrow">THE MATCH-3 ARCADE NEVER ENDS</div><h1 className="hero">PEBBLE <em>POP!</em></h1><p className="desc">Swipe, match, trigger chain reactions and uncover surprise boosters. Every level brings a new twist — from Level 1 to <b>1,000,000,000</b>.</p><div className="pebbles"><div className="orb c0"><i className="fa-solid fa-heart"></i></div><div className="orb c1"><i className="fa-solid fa-droplet"></i></div><div className="orb c2"><i className="fa-solid fa-star"></i></div><div className="orb c3"><i className="fa-solid fa-leaf"></i></div><div className="orb c4"><i className="fa-solid fa-gem"></i></div></div><div className="homebuttons"><button className="primary" onClick={()=>start(1)}><i className="fa-solid fa-play"></i> NEW GAME</button><button className="secondary" onClick={()=>start(bestLevel)}><i className="fa-solid fa-forward"></i> CONTINUE · LVL {bestLevel.toLocaleString()}</button></div><div className="stats"><div className="stat"><strong>{best.toLocaleString()}</strong><span>High score</span></div><div className="stat"><strong>{bestLevel.toLocaleString()}</strong><span>Best level</span></div><div className="stat"><strong>{wins.toLocaleString()}</strong><span>Levels won</span></div></div><p className="foot">Tap a pebble, then an adjacent pebble to swap. Match 3 or more. Sound and voice controls are at the top.</p></main>:<div className="layout"><main className="main panel"><div className="gamehead"><div><div className="label">CURRENT CHALLENGE</div><div className="level">LEVEL {level.toLocaleString()}</div></div><div className="score">{score.toLocaleString()}<small>SCORE / {cfg.target.toLocaleString()}</small></div></div><section className="challenge"><div style={{display:'flex',justifyContent:'space-between',gap:8}}><b>{cfg.mode}</b><strong>{left} moves left</strong></div><div style={{marginTop:5}}>{cfg.goal}</div><div className="bar"><div style={{width:clamp(score/cfg.target*100,0,100)+'%'}}></div></div></section><div className="boardwrap"><div className="board" style={{gridTemplateColumns:`repeat(${cfg.size},minmax(0,1fr))`}}>{board.map((row,r)=>row.map((g,c)=><button key={g.id||r+'-'+c} aria-label={`pebble ${r+1} ${c+1}`} className={'tile '+(selected&&selected.r===r&&selected.c===c?'selected ':'')+(g.frozen?'frozen ':'')+(g.gold?'golden':'')} onClick={()=>act(r,c)}><span className={'gem c'+g.type+(g.special?' special':'')}>{g.special==='bomb'?<i className="fa-solid fa-bomb"></i>:g.special==='rainbow'?<i className="fa-solid fa-wand-magic-sparkles"></i>:<i className={'fa-solid '+icons[g.type]}/>}</span></button>))}</div></div><div className="tools"><button className="tool" onClick={()=>{Boost(v=>v==='bomb'?'':'bomb');notify('Tap a pebble to blast its neighbours')}}><i className="fa-solid fa-bomb"></i> Blast <b>✦</b></button><button className="tool" onClick={()=>{Boost(v=>v==='rainbow'?'':'rainbow');notify('Tap a pebble to clear its colour')}}><i className="fa-solid fa-wand-magic-sparkles"></i> Rainbow <b>✦</b></button><button className="tool" onClick={()=>{Boost('undo')}}><i className="fa-solid fa-rotate-left"></i> Undo</button></div><p className="foot">{booster?'BOOSTER SELECTED — tap any pebble to use it.':'Tap one pebble, then tap a neighbouring pebble to swap.'}</p></main><aside className="side panel"><section className="card"><h3><i className="fa-solid fa-bullseye" style={{color:'var(--pink)'}}></i> Level mission</h3><div className="mission">◉ Reach the score target</div><div className="mission">◉ Build combo chains</div><div className="mission">◉ {level%5===0?'Crack frozen pebbles':'Keep your streak alive'}</div></section><section className="card"><h3><i className="fa-solid fa-wand-magic-sparkles" style={{color:'var(--gold)'}}></i> Level twist</h3><p><b style={{color:'var(--cyan)'}}>{cfg.mode}</b><br/>{cfg.twists.join(' • ')||'Learn the board, build combos, find your rhythm.'}<br/><br/>Challenges scale and rotate as you climb. Levels are generated up to one billion.</p></section><section className="card"><h3><i className="fa-solid fa-trophy" style={{color:'var(--gold)'}}></i> Arcade stats</h3><p>High score: <b>{best.toLocaleString()}</b><br/>Best level: <b>{bestLevel.toLocaleString()}</b><br/>Combo chain: <b>{combo}</b></p></section><section className="card"><h3><i className="fa-solid fa-microphone-lines" style={{color:'var(--green)'}}></i> Cheerleader voice</h3><p>{voice?'ON — hear “Pebblelicious!”, “Cool!”, and “Fantastic!” after moves.':'OFF — tap the speaker button to enable praise.'} Some browsers start voice after your first interaction.</p></section><button className="secondary" onClick={home}><i className="fa-solid fa-house"></i> HOME / NEW GAME</button></aside></div>}
{modal&&<div className="overlay"><div className="modal panel"><div style={{fontSize:46}}>{modal==='win'?'🏆':'✨'}</div><div className="eyebrow">{modal==='win'?'CHALLENGE COMPLETE':'ROUND OVER'}</div><h2>{modal==='win'?'Pebblelicious!':'So close!'}</h2><p>{modal==='win'?`Level ${level.toLocaleString()} cleared with ${score.toLocaleString()} points. Ready for a new twist?`:`You scored ${score.toLocaleString()} points. Try a new strategy and beat your high score.`}</p><div className="stats"><div className="stat"><strong>{score.toLocaleString()}</strong><span>Score</span></div><div className="stat"><strong>{moves}</strong><span>Moves</span></div><div className="stat"><strong>{combo}</strong><span>Combo</span></div></div><button className="primary" onClick={()=>{if(modal==='win'){localStorage.ppdWins=+(localStorage.ppdWins||0)+1;W(+(localStorage.ppdWins));start(Math.min(1000000000,level+1))}else start(level)}}>{modal==='win'?'NEXT LEVEL':'TRY AGAIN'} <i className="fa-solid fa-arrow-right"></i></button><button className="secondary" onClick={home}>BACK TO HOME</button></div></div>}</div>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
